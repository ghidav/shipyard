[project]
name = "shipyard"
version = "0.1.0"
description = "Post-training on Harbor jobs: a blueprint is a config, a run is its record."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Davide Ghilardi" }]
keywords = [
    "post-training",
    "reinforcement-learning",
    "llm",
    "agents",
    "harbor",
    "tinker",
    "dapo",
    "grpo",
    "cispo",
    "gepa",
]
# The license is the SPDX expression above: PEP 639 retires the `License ::` classifiers
# once `license` is an expression, and an index may refuse a file carrying both.
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "typer>=0.16",
    "rich>=14.1",
    "shortuuid>=1.0.13",
    "python-dotenv>=1.0",
    "harbor>=0.23,<0.25",
    "tinker>=0.27",
    "tinker-cookbook>=0.5.5,<0.6",
    "harness-proxy",
    "litellm>=1.103",
    "tomli-w>=1.0",
]

[project.urls]
Repository = "https://github.com/ghidav/shipyard"
Issues = "https://github.com/ghidav/shipyard/issues"

[project.scripts]
shipyard = "shipyard.cli:app"

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.8"]
wandb = ["wandb>=0.21"]
# An agent on Together post-training: `[agent] provider = "together"`.
together = ["harness-proxy[together]"]
gepa = [
    "gepa>=0.1.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shipyard"]

# What `shipyard init` copies into the directory it runs in.
[tool.hatch.build.targets.wheel.force-include]
"recipes" = "shipyard/recipes"
".env.example" = "shipyard/env.example"

[tool.hatch.build.targets.sdist]
only-include = ["src", "tests", "recipes", ".env.example", "README.md", "LICENSE", "pyproject.toml"]

[tool.uv.workspace]
members = ["packages/harness-proxy"]

[tool.uv.sources]
harness-proxy = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests", "packages/harness-proxy/tests"]
# The proxy's fakes (`proxies`) live with its tests; shipyard's tests import them too.
pythonpath = ["src", "packages/harness-proxy/src", "packages/harness-proxy/tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
src = ["src", "tests", "packages/harness-proxy/src", "packages/harness-proxy/tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
