[project]
name = "shipyard"
version = "0.1.0"
description = "Post-training on Harbor jobs: a blueprint is a config, a run is its record."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Davide Ghilardi" }]
keywords = [
    "post-training",
    "reinforcement-learning",
    "llm",
    "agents",
    "harbor",
    "tinker",
    "dapo",
    "grpo",
    "cispo",
    "gepa",
]
# The license is the SPDX expression above: PEP 639 retires the `License ::` classifiers
# once `license` is an expression, and an index may refuse a file carrying both.
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "typer>=0.16",
    "rich>=14.1",
    "shortuuid>=1.0.13",
    "python-dotenv>=1.0",
    "harbor>=0.23,<0.25",
    "tinker>=0.27",
    "tinker-cookbook>=0.5.5,<0.6",
    "pypdfium2>=4.30",
    "pillow>=10",
]

[project.urls]
Repository = "https://github.com/ghidav/shipyard"
Issues = "https://github.com/ghidav/shipyard/issues"

[project.scripts]
shipyard = "shipyard.cli:app"

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shipyard"]

[tool.hatch.build.targets.sdist]
only-include = ["src", "tests", "README.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
