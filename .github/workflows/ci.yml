name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
        # locked: uv.lock's versions; highest: the newest pyproject.toml allows, which a fresh
        # `uv tool install shipyard-rl` gets.
        resolution: ["locked", "highest"]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --extra dev --extra gepa --extra together ${{ matrix.resolution == 'highest' && '--upgrade' || '' }}
      - if: matrix.resolution == 'locked'
        run: uv run ruff check src tests recipes packages
      - if: matrix.resolution == 'locked'
        run: uv run ruff format --check src tests recipes packages
      - run: uv run pytest -q
