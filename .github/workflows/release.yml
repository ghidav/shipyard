name: Release

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write  # trusted publishing: PyPI takes the workflow's OIDC token, no API token
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      # Both packages: shipyard depends on harness-proxy, so a release publishes the two.
      - run: uv build --all-packages
      - uses: pypa/gh-action-pypi-publish@release/v1
