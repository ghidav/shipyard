name: Release

# A package is released by a tag of its own: `harness-proxy-v0.1.0` publishes harness-proxy at
# the version its pyproject.toml holds. Each package is published by a step of its own, since
# PyPI's token for a trusted publisher covers the projects of that publisher alone.
on:
  push:
    tags: ["harness-proxy-v*"]

jobs:
  harness-proxy:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write  # trusted publishing: PyPI takes the workflow's OIDC token, no API token
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - run: uv build --package harness-proxy --out-dir dist
      - uses: pypa/gh-action-pypi-publish@release/v1
