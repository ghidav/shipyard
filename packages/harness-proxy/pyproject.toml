[project]
name = "harness-proxy"
version = "0.1.0"
description = "OpenAI- and Anthropic-compatible model server for agent harnesses, backed by Tinker, that records every call as token ids."
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Davide Ghilardi" }]
keywords = ["reinforcement-learning", "llm", "agents", "tinker", "proxy"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.9",
    "httpx>=0.27",
    "tinker>=0.27",
    "tinker-cookbook>=0.5.5,<0.6",
    "pypdfium2>=4.30",
    "pillow>=10",
]

[project.scripts]
harness-proxy = "harness_proxy.serve:main"

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24"]
# The `together` backend, which samples a Together post-training session.
together = ["together>=2.42"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harness_proxy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
asyncio_mode = "auto"
