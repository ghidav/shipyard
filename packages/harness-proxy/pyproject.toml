[project]
name = "harness-proxy"
version = "0.1.0"
description = "OpenAI- and Anthropic-compatible model server for agent harnesses, backed by Tinker, that records every call as token ids."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Davide Ghilardi" }]
keywords = ["reinforcement-learning", "llm", "agents", "tinker", "proxy"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.9",
    "httpx>=0.27",
    # tinker: below 0.39, the first minor no run has used, since a minor can change its API.
    "tinker>=0.38,<0.39",
    # tinker-cookbook: 0.6 is the first to tokenize Inkling 2 Small with its own tokenizer.
    "tinker-cookbook>=0.6,<0.7",
    "pypdfium2>=4.30",
    "pillow>=10",
]

[project.urls]
Repository = "https://github.com/ghidav/shipyard"
Issues = "https://github.com/ghidav/shipyard/issues"

[project.scripts]
harness-proxy = "harness_proxy.serve:main"

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24"]
# The `together` backend, which samples a Together post-training session; below 3, a major no
# run has used.
together = ["together>=2.42,<3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harness_proxy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
asyncio_mode = "auto"
