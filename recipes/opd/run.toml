# On-policy distillation: Qwen3-32B teaches Qwen3-8B on Reasoning Gym's easy split. Run it with
# trainer.py. The teacher reads the agent's token ids, so it shares its tokenizer.
[models.agent]
model = "Qwen/Qwen3-8B"
learning_rate = 2e-5
lora_rank = 32
max_tokens = 8192

[models.teacher]
model = "Qwen/Qwen3-32B"

[data]
train = "reasoning-gym-easy"
batch_size = 16

[rollout]
sandbox = "together"
concurrency = 32
setup_timeout = 900

[recipe]
steps = 100
harness = "pi@0.85.1"
group_size = 4

[checkpoints]
every = 10
