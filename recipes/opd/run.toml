# On-policy distillation: Qwen3.6-35B-A3B teaches Qwen3.5-9B on Reasoning Gym's easy split. Run it
# with trainer.py. The teacher reads the agent's token ids, so the two share a tokenizer, as these
# do.
[models.agent]
model = "Qwen/Qwen3.5-9B"
learning_rate = 2e-5
lora_rank = 32
max_tokens = 8192

[models.teacher]
model = "Qwen/Qwen3.6-35B-A3B"

[data]
train = "reasoning-gym-easy"
batch_size = 16

[rollout]
sandbox = "modal"
concurrency = 32
setup_timeout = 900

[recipe]
steps = 100
harness = "pi@0.85.1"
group_size = 4

[checkpoints]
every = 10
