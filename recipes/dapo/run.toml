# DAPO on Reasoning Gym's easy split: 10 steps of 8 tasks, 8 trials each, a short run to raise
# `steps` from. Run it with trainer.py.
[models.agent]
model = "Qwen/Qwen3.5-9B"
learning_rate = 2e-5
lora_rank = 32
max_tokens = 8192

[data]
train = "reasoning-gym-easy"
batch_size = 8

[rollout]
sandbox = "modal"
concurrency = 32
setup_timeout = 900

[recipe]
steps = 10
harness = "pi@0.85.1"
group_size = 8
# The paper's 16 mini-batches a step, at most one for each group a step keeps, and its
# clip-higher: 0.2 below 1, 0.28 above.
substeps = 16
clip_low = 0.2
clip_high = 0.28
# Eq. 13's -1 on Harbor's 0 to 1 scale, over the last fifth of the token budget.
overlong_penalty = 0.5
overlong_buffer = 0.2

[checkpoints]
every = 10
