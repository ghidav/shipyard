# Dr. GRPO on Reasoning Gym's easy split: 16 problems a step, 8 rollouts each.
[agent]
model = "Qwen/Qwen3-8B"
harness = "pi@0.85.1"

[data]
train = "reasoning-gym-easy"
batch_size = 16
group_size = 8

[rollout]
sandbox = "modal"
concurrency = 32
setup_timeout = 900
max_tokens = 8192

[recipe]
learning_rate = 2e-5
steps = 100
lora_rank = 32
clip = 0.2
# Shipyard's length penalty, not the paper's: off.
length_penalty = 0.0
length_floor = 0
length_cap = 0.5

[checkpoints]
every = 10
