# Train Inkling-Small with cispo on Reasoning Gym's easy split: 16 problems a step, 8 rollouts each.
[agent]
model = "thinkingmachines/Inkling-Small"
harness = "pi@0.85.1"

[data]
train = "reasoning-gym-easy"
batch_size = 16
group_size = 8

[rollout]
sandbox = "modal"
concurrency = 32
setup_timeout = 900
max_tokens = 8192

[recipe]
kind = "cispo"
learning_rate = 2e-5
steps = 100
lora_rank = 32

[checkpoints]
every = 10
