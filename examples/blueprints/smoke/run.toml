# One task, two rollouts: Inkling-Small served by this run, pi in a local Docker container.
[model]
name = "thinkingmachines/Inkling-Small"

[data]
dataset = "hello-world"
batch_size = 1
group_size = 2

[rollout]
harness = "pi@0.85.1"
sandbox = "docker"
concurrency = 2
max_tokens = 4096

[recipe]
kind = "evaluate"
