# Fast-slow training on Reasoning Gym: the weights and four skill texts in cycles of six steps.
# Each problem's 8 rollouts split 2 per text. Defaults otherwise are the paper's.
[model]
name = "thinkingmachines/Inkling-Small"
lora_rank = 32

[data]
dataset = "reasoning-gym-easy"
batch_size = 16
group_size = 8

[rollout]
harness = "pi@0.85.1"
sandbox = "modal"
concurrency = 32
setup_timeout = 900
max_tokens = 8192

[recipe]
kind = "fst"
learning_rate = 2e-5
population = 4
cycle = 6
reflection_harness = "claude-code"
reflection_model = "claude-sonnet-5-5"

[checkpoints]
every = 12
