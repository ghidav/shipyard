# Train Inkling-Small with dapo on Reasoning Gym's easy split, and teach each failed rollout
# through Claude's feedback on it: the policy, reading the feedback before the task, scores
# the tokens it sampled without it. Run it with this directory's trainer.py.
[agent]
model = "thinkingmachines/Inkling-Small"
harness = "pi@0.85.1"

[data]
train = "reasoning-gym-easy"
batch_size = 16
group_size = 8

[rollout]
sandbox = "modal"
concurrency = 32
setup_timeout = 900
max_tokens = 8192

[recipe]
kind = "dapo"
learning_rate = 2e-5
steps = 100
lora_rank = 32
teacher = "current"
teacher_coef = 0.5

[checkpoints]
every = 10
